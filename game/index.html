<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Ember Foundry — Tactical FPS</title>
  <style>
    :root{color-scheme:dark;--charcoal:#1a1d22;--steel:#2c313a;--rust:#b4552a;--ember:#ff7a1a;--gold:#f0a830;--ink:#e9e6df}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--charcoal);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
    canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}
    #crosshair{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%)}
    .line{position:absolute;background:var(--ink);box-shadow:0 0 3px #000}.line.top,.line.bottom{width:2px;height:6px;left:9px}.line.top{top:0}.line.bottom{bottom:0}.line.left,.line.right{height:2px;width:6px;top:9px}.line.left{left:0}.line.right{right:0}
    #hitmarker{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;color:var(--ink);opacity:0}
    #health,#ammo,#timer,#score,#money{position:absolute;padding:8px 11px;background:#1a1d22cc;border-top:2px solid var(--ember);font-weight:700}
    #health{left:20px;bottom:22px;width:180px}#health-bar{height:7px;background:#454a50;margin-top:5px}#health-fill{height:100%;width:100%;background:#e46b3c}
    #ammo{right:20px;bottom:22px}#timer{top:18px;left:50%;transform:translateX(-50%);min-width:90px;text-align:center;font-size:20px}#score{top:18px;left:20px}#money{top:18px;right:20px;color:var(--gold)}
    #round-banner{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:26px;font-weight:800;color:var(--gold);text-align:center}
    #killfeed{position:absolute;right:20px;top:70px;text-align:right;line-height:1.7}
     #buy-menu{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 32px));padding:20px;background:#1a1d22f2;border:1px solid #626971;display:none}.hidden{display:none!important}
    #buy-menu h2{margin:0 0 12px;color:var(--gold);font-size:20px}#buy-menu button{width:100%;padding:10px;margin:4px 0;background:var(--steel);border:1px solid #555d66;color:var(--ink);text-align:left;font-size:15px;cursor:pointer}
     #bomb-status{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);text-align:center;color:var(--gold);min-width:200px}#bomb-bar{height:5px;margin-top:5px;background:#454a50}#bomb-fill{height:100%;width:0;background:var(--gold)}
     #hint{display:none;position:absolute;left:50%;top:63%;transform:translateX(-50%);font-size:15px;background:#1a1d22c9;padding:8px 12px}
    #shot-caption{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:13px;color:var(--ink)}
    @media(max-width:600px){#health{left:10px;bottom:12px;width:140px}#ammo{right:10px;bottom:12px}#score{left:10px;top:10px}#money{right:10px;top:10px}#timer{top:10px}}
  </style>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
</head>
<body>
  <div id="hud">
    <div id="crosshair"><i class="line top"></i><i class="line right"></i><i class="line bottom"></i><i class="line left"></i></div>
    <div id="hitmarker">+</div>
    <div id="health"><span>HEALTH</span> <b id="health-value">100</b><div id="health-bar"><div id="health-fill"></div></div></div>
    <div id="ammo"><span id="weapon-name">Slag P9</span> <b id="ammo-mag">12</b> / <span id="ammo-reserve">36</span> <b id="reload-indicator"></b></div>
    <div id="timer">1:40</div><div id="score">EMBER 0 <span>:</span> 0 SLAG</div><div id="money">$800</div>
    <div id="round-banner">ROUND 1</div><div id="killfeed"></div>
    <div id="buy-menu"><h2>FOUNDRY ARMORY</h2><button>1 — VK-7 Foundry — $2700</button><button>2 — Spark-9 — $1500</button><button>3 — Forge Grenade — $300</button><button>4 — Smokescreen — $300</button></div>
    <div id="bomb-status"><span id="bomb-label"></span><div id="bomb-bar"><div id="bomb-fill"></div></div></div><div id="hint">Klik untuk bermain</div><div id="shot-caption"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
